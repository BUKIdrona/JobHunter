# How often to look for new postings, and how far back a posting can be.
interval: 2h
lookback: 168h

# Match score is explained in the README. 10 keeps generic Java/frontend roles out.
min_score: 10

# Caps so a bug cannot mail a large number of people.
max_hr_emails_per_run: 8
max_hr_emails_per_day: 20
max_digest_jobs: 100
max_detail_fetches: 80

# Remote roles limited to the US, UK, EU, and similar are skipped.
# Set true to keep every remote role regardless of country.
accept_any_remote: false

state_path: data/state.json
outbox_dir: data/outbox

